<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  네트워크 실패로 원격 문서(server.url)를 못 받았을 때 WebView 가 대신 띄우는 화면.
  capacitor.config.ts 의 server.errorPath 가 이 파일을 가리킨다.

  ⚠️ 제약: 이 화면은 네트워크가 없을 때 떠야 하므로 **렌더에 필요한 외부 자산이 0이어야
     한다**. 폰트·이미지·CSS·JS 전부 인라인. 앱의 i18n 시스템(서버 렌더 의존)도 못 쓴다 —
     그래서 문구를 여기에 복제한다. 원본은 src/i18n/messages/*.ts 이며, 문구를 고칠
     일이 생기면 양쪽을 함께 고쳐야 한다.
     (연결 확인용 probe 요청은 예외다 — 실패하는 것이 정상 동작이라 렌더를 막지 않는다.)

  middleware.ts 의 nonce CSP 를 거치지 않으므로 자체 CSP 를 박는다.
  connect-src 는 probe 대상 오리진만 연다.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'none'; connect-src https://timemanager.mungji.com; base-uri 'none'; form-action 'none'">
<title>TimeManager</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f6f6f7;
    --text: #202024;
    --text-2: #6b6b73;
    --border: #e3e3e7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101013;
      --surface: #1a1a1f;
      --text: #f2f2f4;
      --text-2: #9a9aa4;
      --border: #2a2a31;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px calc(24px + env(safe-area-inset-right)) 24px calc(24px + env(safe-area-inset-left));
    -webkit-user-select: none;
    user-select: none;
  }
  main { max-width: 320px; text-align: center; }
  .brand {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-2);
  }
  h1 { font-size: 18px; font-weight: 600; margin: 18px 0 8px; }
  p { font-size: 14px; line-height: 1.6; color: var(--text-2); margin: 0; }
  button {
    margin-top: 24px;
    width: 100%;
    height: 46px;
    font-size: 14px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  button:active { opacity: 0.7; }
</style>
</head>
<body>
<main>
  <div class="brand">timemgr</div>
  <h1 id="title">You're offline</h1>
  <p id="body">Check your connection. This screen will retry on its own once you're back online.</p>
  <button id="retry" type="button">Retry</button>
</main>
<script>
  (function () {
    // 앱의 i18n 과 같은 2자 슬라이스 정규화. 미지원 언어는 en 으로 폴백한다.
    var MESSAGES = {
      en: ["You're offline", "Check your connection. This screen will retry on its own once you're back online.", 'Retry'],
      ko: ['오프라인입니다', '네트워크 연결을 확인해 주세요. 연결되면 이 화면이 스스로 다시 시도합니다.', '다시 시도'],
      ja: ['オフラインです', '接続を確認してください。オンラインに戻ると自動で再試行します。', '再試行'],
      zh: ['当前处于离线状态', '请检查网络连接。恢复联网后将自动重试。', '重试'],
      es: ['Sin conexión', 'Comprueba tu conexión. Esta pantalla lo reintentará sola cuando vuelvas a estar en línea.', 'Reintentar'],
      fr: ['Vous êtes hors ligne', 'Vérifiez votre connexion. Cet écran réessaiera tout seul dès votre retour en ligne.', 'Réessayer'],
      de: ['Du bist offline', 'Prüfe deine Verbindung. Dieser Bildschirm versucht es automatisch erneut, sobald du wieder online bist.', 'Erneut versuchen'],
      pt: ['Você está offline', 'Verifique sua conexão. Esta tela tentará novamente sozinha quando você voltar a ficar online.', 'Tentar novamente'],
      ru: ['Нет подключения', 'Проверьте соединение. Экран повторит попытку сам, как только связь появится.', 'Повторить']
    };

    var lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
    var m = MESSAGES[lang] || MESSAGES.en;
    document.documentElement.lang = MESSAGES[lang] ? lang : 'en';
    document.getElementById('title').textContent = m[0];
    document.getElementById('body').textContent = m[1];
    document.getElementById('retry').textContent = m[2];

    // 이 오리진으로 되돌아가는 것이 곧 재시도다. App-Bound Domains 하에서도
    // 허용된 도메인이라 이동이 막히지 않는다.
    var HOME = 'https://timemanager.mungji.com/';
    var done = false;

    // ⚠️ 캡티브 포털(카페·호텔의 로그인 페이지)은 어떤 요청에나 200 을 돌려준다.
    // 아래 probe 는 mode:'no-cors' 라 응답 내용을 읽을 수 없어 그 200 을 "복구"로
    // 오인하고 HOME 으로 이동하는데, 실제 앱은 여전히 못 뜨니 errorPath 를 타고
    // 이 화면으로 되돌아온다 — 자동 이동 ↔ 실패가 페이지 로드 단위로 무한 반복된다.
    // (done 플래그는 한 페이지 안에서만 유효해서 이 루프를 못 막는다.)
    // 그래서 "짧은 시간 안에 되돌아온 횟수"를 세션에 기록해 두고, 반복되면 자동
    // 이동을 멈춘다. 수동 버튼은 언제나 동작하므로 사용자가 막히지는 않는다.
    var BOUNCE_KEY = 'timemgr-offline-bounce';
    var BOUNCE_WINDOW_MS = 15000;
    var MAX_BOUNCES = 2;

    function readBounces() {
      try {
        var raw = sessionStorage.getItem(BOUNCE_KEY);
        if (!raw) return { n: 0, at: 0 };
        var v = JSON.parse(raw);
        return { n: v.n || 0, at: v.at || 0 };
      } catch (_) {
        return { n: 0, at: 0 };
      }
    }
    function writeBounces(v) {
      try { sessionStorage.setItem(BOUNCE_KEY, JSON.stringify(v)); } catch (_) {}
    }

    var prev = readBounces();
    // at 이 최근이면 방금 자동 이동을 했다가 되돌아온 것이다.
    var bounces = (prev.at && Date.now() - prev.at < BOUNCE_WINDOW_MS) ? prev.n + 1 : 0;
    writeBounces({ n: bounces, at: 0 });
    var autoRetryBlocked = bounces >= MAX_BOUNCES;

    function retry(isAuto) {
      if (done) return;
      // 자동 이동만 막는다. 사용자가 직접 누르는 것은 언제나 통과시키고,
      // 그 시점에 카운터를 비워 자동 이동을 다시 허용한다.
      if (isAuto && autoRetryBlocked) return;
      done = true;
      writeBounces(isAuto ? { n: bounces, at: Date.now() } : { n: 0, at: 0 });
      location.replace(HOME);
    }

    // ⚠️ 리스너에 retry 를 그대로 넘기면 Event 객체가 isAuto 로 들어가 항상 자동으로
    // 취급된다 — 수동 재시도가 차단될 수 있으니 반드시 감싼다.
    document.getElementById('retry').addEventListener('click', function () { retry(false); });

    // ⚠️ online 이벤트만으로는 안 된다. Android WebView 는 시스템 연결 상태를
    // 추적하지 않아 navigator.onLine 이 기내모드에서도 true 로 고정되고
    // online/offline 이벤트가 아예 발생하지 않는다(에뮬레이터 실측). 이 리스너는
    // iOS·웹 PWA 에서만 의미가 있으므로, 실제 복귀 감지는 아래 probe 가 맡는다.
    window.addEventListener('online', function () { retry(true); });

    // 원격 오리진에 직접 찔러 본다. no-cors 라 응답 내용은 못 읽지만 성공/실패는
    // 구분되고, 그게 우리가 알아야 하는 전부다.
    var INITIAL_DELAY = 3000;
    var MAX_DELAY = 30000;
    var delay = INITIAL_DELAY;
    var timer = null;
    var inFlight = false;

    // ⚠️ 예약은 반드시 이 함수를 통한다. 대기 중인 타이머를 지우지 않고 probe 를
    // 또 걸면 체인이 갈라져 배로 늘어난다 — 오프라인 상태로 앱을 껐다 켤 때마다
    // 두 배가 되어, 정작 배터리가 아쉬운 상황에서 probe 폭풍이 된다.
    function schedule(ms) {
      if (timer !== null) clearTimeout(timer);
      timer = setTimeout(probe, ms);
    }

    function probe() {
      timer = null;
      if (done || inFlight) return;
      inFlight = true;
      var ctl = new AbortController();
      var kill = setTimeout(function () { ctl.abort(); }, 4000);
      fetch(HOME, { method: 'HEAD', mode: 'no-cors', cache: 'no-store', signal: ctl.signal })
        .then(function () { clearTimeout(kill); inFlight = false; retry(true); })
        .catch(function () {
          clearTimeout(kill);
          inFlight = false;
          // 화면이 보이지 않는 동안에는 멈춘다. 백그라운드에서 복귀를 감지해봐야
          // 이동할 수도 없고, 오프라인으로 방치된 기기가 무한히 네트워크를 두드리는
          // 것을 막는다. 다시 보이는 순간 아래 visibilitychange 가 즉시 이어받는다.
          // (utils/connectivity.ts 와 같은 규칙 — 한쪽만 고치면 나머지가 남는다.)
          if (document.visibilityState === 'hidden') return;
          // 오래 방치된 기기가 계속 같은 간격으로 두드리지 않도록 서서히 늦춘다.
          delay = Math.min(Math.round(delay * 1.5), MAX_DELAY);
          schedule(delay);
        });
    }

    // 자동 이동이 막힌 상태에서는 probe 를 돌릴 이유가 없다 — probe 의 유일한 목적이
    // 자동 이동이라 성공해도 아무 일도 일어나지 않고 배터리만 쓴다. 재시도 버튼은
    // 그대로 살아 있으므로 사용자는 언제든 직접 복귀할 수 있다.
    if (!autoRetryBlocked) schedule(delay);

    // 앱으로 돌아온 순간이 연결이 회복돼 있을 가능성이 가장 크다.
    // 백오프가 늘어나 있어도 여기서 즉시 확인한다.
    document.addEventListener('visibilitychange', function () {
      if (autoRetryBlocked) return;
      if (document.visibilityState !== 'visible') return;
      delay = INITIAL_DELAY;
      schedule(0);
    });
  })();
</script>
</body>
</html>
