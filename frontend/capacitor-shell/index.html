<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  원격 로드(server.url) 구조라 이 파일은 정상 경로에서는 서빙되지 않는다. 그래도
  Capacitor 가 webDir 의 존재를 요구하고, 원격 문서를 받기 전 아주 짧은 순간이나
  일부 실패 경로에서 노출될 수 있어 흰 화면 대신 로딩 스플래시를 둔다.
  외부 요청 0(파일 하나로 완결)이라는 제약은 offline.html 과 같다.
-->
<title>TimeManager</title>
<style>
  :root { --bg: #ffffff; --text-2: #6b6b73; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101013; --text-2: #9a9aa4; } }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text-2);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex; align-items: center; justify-content: center;
  }
  .brand { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
  .dot {
    display: inline-block; width: 5px; height: 5px; margin-left: 8px;
    border-radius: 50%; background: currentColor;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.2 } 50% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; opacity: 0.6 } }
</style>
</head>
<body>
  <div class="brand">timemgr<span class="dot"></span></div>
</body>
</html>
