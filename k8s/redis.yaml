# 이 Redis 는 캐시가 아니라 **세션 저장소**다 — refresh token 세션(auth_session:*, TTL 30일)이
# 여기에만 있다. 볼륨이 없던 시절엔 RDB 가 컨테이너 쓰기 레이어(/data)에 떨어져서, 파드가 다시
# 만들어질 때마다(노드 재부팅·재스케줄·이미지 갱신) 모든 세션이 사라지고 전원이
# /api/v1/auth/refresh 에서 400 dead_token 으로 로그아웃됐다.
#
# ⚠️ CI(deploy.yml)는 이 파일을 apply 하지 않는다(frontend·backend 만). 바꿨으면 손으로
#    `kubectl diff -f` → `kubectl apply -f` 한다(GLOBAL-PIT-083).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: timemanager-redis-pvc
  namespace: timemanager
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: timemanager
spec:
  replicas: 1
  # RWO PVC + 레플리카 1개에서 RollingUpdate 는 구 파드를 살려둔 채 새 파드를 띄운다 — 같은
  # appendonlydir 에 두 redis 가 붙는다(GLOBAL-PIT-095). 구 파드를 먼저 완전히 내린다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      nodeSelector:
        project-timemanager: "true"
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          # command 가 아니라 args 다 — command 는 이미지 ENTRYPOINT(docker-entrypoint.sh)를 건너뛰어
          # redis 가 root 로 돈다(2026-10-01 실측). entrypoint 를 거치면 /data 소유권을 redis 로
          # 바꾼 뒤 redis(uid 999)로 내려간다.
          #
          # 영속성: AOF(everysec, 최악 1초 유실) + 기본 RDB save 스케줄을 둘 다 켠다.
          # 🔴 AOF 를 켠 채로 띄우면 RDB(dump.rdb)는 **읽지 않는다** — appendonlydir 이 없으면 빈
          #    상태로 뜨고 다음 저장 때 dump.rdb 까지 덮어쓴다(redis 7.4 실측). RDB 만 있는 백업을
          #    복원할 때는 appendonly 를 끈 채 띄워 적재한 뒤 `CONFIG SET appendonly yes` 로
          #    appendonlydir 를 만들고, 그다음에 이 설정으로 재기동한다.
          #
          # 축출: noeviction. 세션 키에도 TTL 이 있어서 volatile-* 정책은 세션을 지켜주지 못한다
          # (volatile-lru 는 TTL 있는 키 = auth_session:* 해시와 rl:* 를 똑같이 축출 후보로 본다).
          # 꽉 차면 조용히 강제 로그아웃시키는 대신 쓰기가 OOM 에러로 실패하게 한다. 사용량은
          # 2026-10-01 기준 1.5MB / 128MB, 키 7개.
          args:
            - redis-server
            - --maxmemory
            - 128mb
            - --maxmemory-policy
            - noeviction
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "192Mi"
              cpu: "200m"
        # 메모리·OOM 거부를 Prometheus(monitoring) 로 내보낸다. noeviction 이라 꽉 차면 로그인·refresh
        # 쓰기가 OOM 으로 실패하는데, 이게 없으면 사용자 신고 전까지 아무도 모른다.
        #
        # 🔴 사이드카도 파드 Ready 에 들어간다 — 이 컨테이너가 죽거나 이미지를 못 받으면 파드가 NotReady
        #    가 되고 redis Service 엔드포인트에서 빠져 backend 가 Redis 를 잃는다. 그래서:
        #    - probe 를 두지 않는다(exporter 는 Redis 가 죽어도 redis_up 0 을 내며 계속 산다 — 실측).
        #    - Recreate 라 구 파드가 먼저 내려간다. apply 전에 노드에서 이미지를 미리 받아 둔다
        #      (`crictl pull`). 못 받으면 Redis 가 그동안 통째로 내려간다.
        #
        # /scrape?target= 로 임의 주소에 붙는 기능이 있지만 redis-policy 의 egress: [] 가 파드 밖으로
        # 나가는 걸 막는다(localhost 는 NetworkPolicy 대상이 아니라 자기 redis 에는 붙는다).
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.92.1
          env:
            - name: REDIS_ADDR
              value: redis://localhost:6379
          ports:
            - name: metrics
              containerPort: 9121
          securityContext:
            runAsNonRoot: true
            runAsUser: 59000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # 실측 RSS ~12MiB. 한도에 걸려 OOMKill 되면 위 이유로 Redis 까지 빠지므로 넉넉히 둔다.
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: timemanager-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: timemanager
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
# Prometheus 스크레이프 전용. backend 가 쓰는 redis Service 에 9121 을 섞지 않는다.
# publishNotReadyAddresses: Redis readiness(redis-cli ping)가 실패하는 바로 그때 redis_up 0 을
# 읽어야 하므로 NotReady 파드도 엔드포인트에 남긴다.
apiVersion: v1
kind: Service
metadata:
  name: redis-metrics
  namespace: timemanager
spec:
  selector:
    app: redis
  publishNotReadyAddresses: true
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
