# 기본 정책: 모든 트래픽 거부
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: timemanager
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# ingress-nginx → frontend, backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-ingress
  namespace: timemanager
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - port: 8080
---
# backend → postgres, redis, 외부 API (Google OAuth 등)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-egress
  namespace: timemanager
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
    # 외부 API
    # 공인 IP 로만 — 사설·CGNAT·링크로컬을 빼서 노드 nginx(lab·uptime·grafana)나 LAN 장비로 새지 않게 한다
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8      # 파드·서비스·홈 VLAN
              - 172.16.0.0/12   # SERVER LAN(172.30.1.0/24) — 노드 nginx 443
              - 192.168.0.0/16
              - 100.64.0.0/10   # Tailscale(CGNAT)
              - 169.254.0.0/16  # 링크로컬
      ports:
        - port: 443
          protocol: TCP
    # DNS — CoreDNS(kube-system/kube-dns) 로만. to: 가 없으면 53 으로 어디든 나간다(GLOBAL-PIT-090)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # lab-dashboard 피드백 수집 (인-클러스터 포워딩)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lab
          podSelector:
            matchLabels:
              app: lab-dashboard
      ports:
        - port: 8080
          protocol: TCP
---
# ingress-nginx → frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-ingress
  namespace: timemanager
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 8080
    # DNS — CoreDNS(kube-system/kube-dns) 로만. to: 가 없으면 53 으로 어디든 나간다(GLOBAL-PIT-090)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# postgres: backend에서만 수신
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-policy
  namespace: timemanager
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 5432
  egress: []
---
# redis: backend에서만 수신
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-policy
  namespace: timemanager
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 6379
  egress: []
