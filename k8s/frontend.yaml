# 🔴 이 파일이 frontend 의 정본이다 — 2026-09-25 부터 CI(deploy.yml)가 매 배포마다 apply 한다.
#    그전엔 CI 가 `set image` 만 해서 이 파일을 고쳐도 배포로는 라이브에 닿지 않았다(GLOBAL-PIT-036).
#    2026-05-30~31 Vue→Next.js 전환 때 여기에 env·probe·메모리 256/512Mi 를 넣었지만, 라이브는
#    최초 매니페스트(Vue+nginx 시절) 값인 limit 64Mi 에 probe 없이 남아 next-server 가 거의 매일
#    OOMKill 됐다. 반대로 이 파일엔 라이브에서 걷어낸 NodePort 30080 이 남아 있어서, 그대로
#    apply 했다면 닫아둔 노드포트가 다시 열렸을 것이다(GLOBAL-PIT-083). 둘 다 `kubectl diff` 로
#    확인하고 맞춘 뒤 apply 했다.
#    라이브를 바꿀 일이 있으면 kubectl 이 아니라 이 파일을 고칠 것 — 다음 배포가 덮어쓴다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: timemanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeSelector:
        project-timemanager: "true"
      containers:
        - name: frontend
          image: ghcr.io/yeonjae1220/timemanager-frontend:latest
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: API_URL
              value: "http://backend.timemanager.svc.cluster.local:8080"
          ports:
            - containerPort: 3000
          # readiness 도 liveness 와 같은 /health/live 다 — /health/ready(백엔드까지 확인)가 아니다.
          # 백엔드 readiness 그룹이 db·redis 를 포함하므로, 여기에 /health/ready 를 걸면 DB·Redis
          # 순단 하나가 30초 뒤 frontend 까지 서비스에서 빼 버린다. 레플리카가 1개라 로그인 화면과
          # 앱 셸까지 전부 503 이 되고, 오프라인 큐·캐시로 버틸 기회도 같이 사라진다.
          # 백엔드 연결 상태는 라우팅이 아니라 모니터링이 /health/ready 로 볼 일이다.
          readinessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: timemanager
spec:
  # ClusterIP 다 — 외부 진입은 ingress-nginx 로만 받는다. 라이브는 2026-05-31 `kubectl patch` 로
  # NodePort 30080 을 걷어냈는데 이 파일엔 반영되지 않았다가 2026-09-25 에 맞췄다.
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 3000
